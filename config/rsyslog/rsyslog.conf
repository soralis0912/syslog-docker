# Syslog receiver for network devices.
#
# Design notes that are easy to get wrong:
#   - The container runs with network_mode: host. Publishing -p 514:514/udp
#     instead would put docker-proxy/NAT in the path and rewrite the source
#     address to the bridge gateway (172.x), which breaks both per-device
#     routing below and any source ACL.
#   - Files are named from the RECEIVER's date, so no logrotate and no HUP
#     handling is needed inside an image that has no cron or init.
#   - Senders are routinely on the wrong timezone, and syslog gives you no way
#     to tell that apart from clock skew. Everything here keys off receive time
#     and leaves the device's own fields untouched in the payload.

global(
  workDirectory="/var/spool/rsyslog"
  maxMessageSize="64k"
  parser.escapeControlCharactersOnReceive="off"
)

module(load="imudp" threads="2" timeRequery="8")
input(type="imudp" port="514" ruleset="network")

# Maps source address to a device name. Rendered by entrypoint.sh from
# SYSLOG_DEVICES so that no address is committed to git.
include(file="/etc/rsyslog.d/10-devices.conf")

# Layer 1: one file per device per day. Rotation is a naming problem, not a
# job to schedule.
template(name="netDynFile" type="string"
         string="/var/log/network/%$.device%/%$year%-%$month%-%$day%.log")

# JSON envelope around the device's own payload. recv_time is the receiver's
# clock in RFC3339; the device's clock is left inside "message" untouched.
template(name="netJson" type="list") {
  constant(value="{\"recv_time\":\"")
  property(name="timegenerated" dateFormat="rfc3339")
  constant(value="\",\"device\":\"")
  property(name="$.device")
  constant(value="\",\"src_ip\":\"")
  property(name="fromhost-ip")
  constant(value="\",\"severity\":\"")
  property(name="syslogseverity-text")
  constant(value="\",\"facility\":\"")
  property(name="syslogfacility-text")
  constant(value="\",\"message\":\"")
  property(name="rawmsg-after-pri" format="json")
  constant(value="\"}\n")
}

ruleset(name="network"
        queue.type="LinkedList"
        queue.size="50000"
        queue.dequeueBatchSize="256"
        queue.highWatermark="40000"
        queue.lowWatermark="20000"
        # Layer 3: the queue may spill to disk when the writer stalls, but the
        # spill is capped. An unbounded disk-assisted queue is how a syslog box
        # fills its own filesystem.
        queue.filename="network-q"
        queue.maxDiskSpace="512m"
        queue.saveOnShutdown="on") {

  call resolveDevice

  action(type="omfile"
         dynaFile="netDynFile"
         template="netJson"
         # Bounded handle cache plus an idle timeout, so yesterday's file is
         # released instead of being held open forever.
         dynaFileCacheSize="20"
         closeTimeout="5"
         asyncWriting="off"
         flushOnTXEnd="on"
         createDirs="on"
         # Not world-readable. Device logs carry more than they look like they
         # do - a FortiGate records the presented community verbatim in its
         # "SNMP query failed" event, so a wrong-community probe writes a live
         # credential straight into today's file.
         dirCreateMode="0750"
         fileCreateMode="0640")
}
